<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 580 450" role="img" aria-label="Тревист остров с планини и елхи">
<style>
  .ex-kid{transform-box:fill-box;transform-origin:50% 100%;animation:exPop .7s cubic-bezier(.3,1.6,.5,1) both}
  .ex-k1{animation-delay:.35s}.ex-k2{animation-delay:.55s}.ex-k3{animation-delay:.75s}
  .ex-wave{transform-box:view-box;transform-origin:286px 224px;animation:exWave 1.1s ease-in-out .9s infinite alternate}
  .ex-bino{transform-box:view-box;transform-origin:204px 232px;animation:exLook 3s ease-in-out 1.2s infinite}
  .ex-glint{animation:exGlint 2.4s ease-in-out 1.4s infinite}
  .ex-leaf{animation:exFall 7s linear infinite}
  .ex-l2{animation-delay:-2.3s;animation-duration:8s}.ex-l3{animation-delay:-4.6s;animation-duration:6.5s}.ex-l4{animation-delay:-1.2s;animation-duration:9s}
  .ex-bg{animation:exFade .8s ease-out both}
  @keyframes exPop{from{transform:translateY(40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
  @keyframes exWave{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
  @keyframes exLook{0%,70%,100%{transform:rotate(0)}80%,90%{transform:rotate(-6deg)}}
  @keyframes exGlint{0%,60%,100%{opacity:0}75%{opacity:1}}
  @keyframes exFall{0%{transform:translate(0,-40px) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(-90px,420px) rotate(320deg);opacity:0}}
  @keyframes exFade{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.ex-kid,.ex-wave,.ex-bino,.ex-glint,.ex-leaf,.ex-bg{animation:none}}
</style>
<defs>
  <radialGradient id="exSky" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#e9f6f0"/><stop offset="1" stop-color="#cfe9df"/></radialGradient>
</defs>

<g class="ex-bg">
  <circle cx="330" cy="260" r="215" fill="url(#exSky)"/>
  <path d="M130 268 L215 168 L250 205 L305 128 L362 210 L402 170 L520 268 Z" fill="#ffffff"/>
  <path d="M305 128 L330 166 L318 160 L306 176 L296 156 L286 170 Z" fill="#e7f1ee"/>
  <g fill="#cbdf98">
    <path d="M150 330 L170 262 L190 330 Z"/><path d="M178 336 L196 280 L214 336 Z"/>
    <path d="M440 334 L466 248 L492 334 Z"/><path d="M482 340 L502 280 L522 340 Z"/><path d="M398 330 L414 282 L430 330 Z"/>
  </g>
  <g fill="#b8d27c">
    <path d="M466 248 L492 334 L466 334 Z"/><path d="M170 262 L190 330 L170 330 Z"/><path d="M502 280 L522 340 L502 340 Z"/>
  </g>
</g>

<g class="ex-island">
  <ellipse cx="330" cy="474" rx="210" ry="11" fill="#c4e2d6"/>
  <!-- island rock -->
  <path d="M108 380 L562 378 L528 418 L440 428 L392 462 L258 468 L206 440 L142 424 Z" fill="#6b3d26"/>
  <path d="M206 440 L258 468 L300 400 L170 392 Z" fill="#552d1b"/>
  <path d="M392 462 L440 428 L528 418 L560 380 L420 392 Z" fill="#5c321f"/>
  <path d="M300 400 L392 462 L420 392 Z" fill="#7d4a2e"/>
  <!-- grass top -->
  <path d="M96 374 C104 352 196 344 262 348 C330 352 420 346 470 348 C530 350 576 356 572 374 C568 386 540 388 500 386 L140 388 C110 388 92 384 96 374 Z" fill="#7fa83a"/>
  <path d="M120 372 L136 384 L150 371 L162 386 L176 372 L190 384 L206 372" fill="none" stroke="#6b9030" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="190" cy="360" rx="44" ry="6" fill="#a6c853"/><ellipse cx="420" cy="358" rx="60" ry="6" fill="#a6c853"/>
  <!-- bush -->
  <path d="M500 360 C492 330 512 316 528 326 C536 304 566 310 564 334 C580 336 578 362 560 366 Z" fill="#4e7a2a"/>
  <path d="M520 328 C528 318 540 318 546 326" fill="none" stroke="#3a5e1e" stroke-width="3" stroke-linecap="round"/>
  <!-- rock -->
  <path d="M352 318 L372 300 L408 304 L418 330 L360 336 Z" fill="#8c98a2"/>
  <path d="M372 300 L408 304 L418 330 L388 322 Z" fill="#6f7b86"/>
  <path d="M364 330 L374 322" stroke="#7aa63a" stroke-width="4" stroke-linecap="round"/>

</g>

<g fill="#8fbf6a">
  <path class="ex-leaf" d="M200 90 q8 -8 16 0 q-8 8 -16 0 z"/>
  <path class="ex-leaf ex-l2" d="M420 70 q8 -8 16 0 q-8 8 -16 0 z"/>
  <path class="ex-leaf ex-l3" d="M540 120 q7 -7 14 0 q-7 7 -14 0 z" fill="#a6cf82"/>
  <path class="ex-leaf ex-l4" d="M320 60 q7 -7 14 0 q-7 7 -14 0 z" fill="#a6cf82"/>
</g>
</svg>
